# Runs the agent on several Linux distributions / Node versions against the broker from docker-compose.yml,
# plus the event monitor (stores the readings in Postgres) and the dashboard (graphs) to see the data end to end.
# The monitor and dashboard are in the "apps" profile: docker/test-servers/run.sh enables it unless SKIP_APPS=1
# (run-with-monitor.sh runs them on the host instead).
# Use it together with the main file (see docker/test-servers/run.sh):
#   docker compose -f docker-compose.yml -f docker-compose.test-servers.yml up -d --build
#
# Each container's root filesystem is "overlay", which the agent deliberately ignores, so every service
# mounts a volume on /data to give it a real disk to report.
x-agent: &agent
  restart: "no"
  depends_on:
    - mosquitto
  volumes:
    - testdata:/data
  environment: &agent-env
    MQTT_URL: mqtt://mosquitto:1883
    MQTT_PASSWORD: ${TEST_AGENT_PASSWORD:-}
    HEARTBEAT_INTERVAL_MS: "10000"
    CHECK_INTERVAL_MS: "5000"
    NUXT_ADD_DEBUG_LOGS: "true"

x-monitor-token: &monitor-token test-monitor-token

services:
  # Same Postgres as docker-compose.yml, with a health check so the monitor waits for it.
  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d computer-usage"]
      interval: 3s
      timeout: 3s
      retries: 20

  event-monitor:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/test-servers/Dockerfile.event-monitor
    restart: on-failure
    depends_on:
      postgres: { condition: service_healthy }
      mosquitto: { condition: service_started }
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/computer-usage
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: app
      MQTT_PASSWORD: ${APP_PASSWORD:-}
      # Must match the agents' heartbeat interval below.
      HEARTBEAT_INTERVAL_MS: "10000"
      # Not loopback inside the container, so a token is mandatory.
      EVENT_MONITOR_HOST: 0.0.0.0
      EVENT_MONITOR_PORT: "3100"
      EVENT_MONITOR_TOKEN: *monitor-token
      NUXT_ADD_DEBUG_LOGS: "true"

  dashboard:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/test-servers/Dockerfile.dashboard
    restart: on-failure
    depends_on:
      postgres: { condition: service_healthy }
      event-monitor: { condition: service_started }
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/computer-usage
      EVENT_MONITOR_URL: http://event-monitor:3100
      EVENT_MONITOR_TOKEN: *monitor-token
      NUXT_ADD_DEBUG_LOGS: "true"

  agent-debian12:
    <<: *agent
    build:
      context: .
      dockerfile: docker/test-servers/Dockerfile
      args: { BASE_IMAGE: "debian:12-slim", NODE_IMAGE: "node:22-bookworm-slim", PKG_MANAGER: apt }
    environment: { <<: *agent-env, HOST_ID: test-debian12 }

  agent-ubuntu2404:
    <<: *agent
    build:
      context: .
      dockerfile: docker/test-servers/Dockerfile
      args: { BASE_IMAGE: "ubuntu:24.04", NODE_IMAGE: "node:22-bookworm-slim", PKG_MANAGER: apt }
    environment: { <<: *agent-env, HOST_ID: test-ubuntu2404 }

  agent-fedora:
    <<: *agent
    build:
      context: .
      dockerfile: docker/test-servers/Dockerfile
      args: { BASE_IMAGE: "fedora:41", NODE_IMAGE: "node:22-bookworm-slim", PKG_MANAGER: dnf }
    environment: { <<: *agent-env, HOST_ID: test-fedora }

  # musl libc + busybox tools: the most different environment for systeminformation.
  agent-alpine:
    <<: *agent
    build:
      context: .
      dockerfile: docker/test-servers/Dockerfile
      args: { BASE_IMAGE: "alpine:3.20", NODE_IMAGE: "node:22-alpine", PKG_MANAGER: apk }
    environment: { <<: *agent-env, HOST_ID: test-alpine }

  agent-node24:
    <<: *agent
    build:
      context: .
      dockerfile: docker/test-servers/Dockerfile
      args: { BASE_IMAGE: "debian:12-slim", NODE_IMAGE: "node:24-bookworm-slim", PKG_MANAGER: apt }
    environment: { <<: *agent-env, HOST_ID: test-node24 }

  # Disk threshold of 1% so an alert event is published almost immediately: exercises the event path.
  agent-alert:
    <<: *agent
    build:
      context: .
      dockerfile: docker/test-servers/Dockerfile
      args: { BASE_IMAGE: "debian:12-slim", NODE_IMAGE: "node:22-bookworm-slim", PKG_MANAGER: apt }
    environment: { <<: *agent-env, HOST_ID: test-alert, DISK_THRESHOLD_PERCENT: "1" }
  
  
volumes:
  testdata:
