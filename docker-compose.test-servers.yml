# Runs the agent on several Linux distributions / Node versions against the broker from docker-compose.yml.
# Use it together with the main file (see docker/test-servers/run.sh):
#   docker compose -f docker-compose.yml -f docker-compose.test-servers.yml up -d --build
#
# Each container's root filesystem is "overlay", which the agent deliberately ignores, so every service
# mounts a volume on /data to give it a real disk to report.
x-agent: &agent
  restart: "no"
  depends_on:
    - mosquitto
  volumes:
    - testdata:/data
  environment: &agent-env
    MQTT_URL: mqtt://mosquitto:1883
    MQTT_PASSWORD: ${TEST_AGENT_PASSWORD:-test-agents-pw}
    HEARTBEAT_INTERVAL_MS: "10000"
    CHECK_INTERVAL_MS: "5000"
    NUXT_ADD_DEBUG_LOGS: "true"

services:
  agent-debian12:
    <<: *agent
    build:
      context: .
      dockerfile: docker/test-servers/Dockerfile
      args: { BASE_IMAGE: "debian:12-slim", NODE_IMAGE: "node:22-bookworm-slim", PKG_MANAGER: apt }
    environment: { <<: *agent-env, HOST_ID: test-debian12 }

  agent-ubuntu2404:
    <<: *agent
    build:
      context: .
      dockerfile: docker/test-servers/Dockerfile
      args: { BASE_IMAGE: "ubuntu:24.04", NODE_IMAGE: "node:22-bookworm-slim", PKG_MANAGER: apt }
    environment: { <<: *agent-env, HOST_ID: test-ubuntu2404 }

  agent-fedora:
    <<: *agent
    build:
      context: .
      dockerfile: docker/test-servers/Dockerfile
      args: { BASE_IMAGE: "fedora:41", NODE_IMAGE: "node:22-bookworm-slim", PKG_MANAGER: dnf }
    environment: { <<: *agent-env, HOST_ID: test-fedora }

  # musl libc + busybox tools: the most different environment for systeminformation.
  agent-alpine:
    <<: *agent
    build:
      context: .
      dockerfile: docker/test-servers/Dockerfile
      args: { BASE_IMAGE: "alpine:3.20", NODE_IMAGE: "node:22-alpine", PKG_MANAGER: apk }
    environment: { <<: *agent-env, HOST_ID: test-alpine }

  agent-node24:
    <<: *agent
    build:
      context: .
      dockerfile: docker/test-servers/Dockerfile
      args: { BASE_IMAGE: "debian:12-slim", NODE_IMAGE: "node:24-bookworm-slim", PKG_MANAGER: apt }
    environment: { <<: *agent-env, HOST_ID: test-node24 }

  # Disk threshold of 1% so an alert event is published almost immediately: exercises the event path.
  agent-alert:
    <<: *agent
    build:
      context: .
      dockerfile: docker/test-servers/Dockerfile
      args: { BASE_IMAGE: "debian:12-slim", NODE_IMAGE: "node:22-bookworm-slim", PKG_MANAGER: apt }
    environment: { <<: *agent-env, HOST_ID: test-alert, DISK_THRESHOLD_PERCENT: "1" }
  
  
volumes:
  testdata:
